openapi: "3.0.3"
info:
  title: "DormSupport API"
  version: "1.3.1"
  description: "API системы заявок в общежитии. Учётные записи создаёт ADMIN с логином и паролем; отдельная активация не требуется. JSON camelCase; ошибки {code,message}; даты UTC ISO 8601. JWT Bearer действует 3600 секунд. Каждый сервис имеет собственную БД."
servers:
  -
    url: "http://localhost:8080/api/v1"
    description: "Локальное окружение"
security:
  -
    bearerAuth: []
tags:
  -
    name: "Identity"
    description: "Учётные записи, вход и проживание"
  -
    name: "Issues"
    description: "Заявки, категории и история статусов"
  -
    name: "Internal Identity"
    description: "Доступен только Issues Service, отсутствует в публичном reverse proxy"
paths:
  "/admin/users":
    post:
      operationId: "createUser"
      summary: "Создать пользователя"
      tags:
        - "Identity"
      description: "Только ADMIN. Администратор задаёт логин и пароль и передаёт их пользователю. Допустимые роли нового пользователя: RESIDENT и REVIEWER. Строковые block и roomNumber обязательны для обеих ролей. Сохраняется хеш пароля; в ответе возвращается профиль без пароля."
      responses:
        "201":
          description: "Создано"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "409":
          "$ref": "#/components/responses/Error409"
        "500":
          "$ref": "#/components/responses/Error500"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateUserRequest"
  "/auth/login":
    post:
      operationId: "login"
      summary: "Войти по логину и паролю"
      tags:
        - "Identity"
      description: "Публичная операция. Вход по логину и паролю, заданным администратором. Неверные учётные данные: 401 INVALID_CREDENTIALS. Возвращаются JWT и профиль пользователя. JWT действует 3600 секунд."
      responses:
        "200":
          description: "Успешно"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LoginResponse"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "500":
          "$ref": "#/components/responses/Error500"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LoginRequest"
  "/auth/me":
    get:
      operationId: "getMe"
      summary: "Получить свой профиль"
      tags:
        - "Identity"
      description: "Любой пользователь с действительным JWT."
      responses:
        "200":
          description: "Успешно"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
        "401":
          "$ref": "#/components/responses/Error401"
        "500":
          "$ref": "#/components/responses/Error500"
  "/auth/logout":
    post:
      operationId: "logout"
      summary: "Выйти из аккаунта"
      tags:
        - "Identity"
      description: "Возвращает 204. Клиент удаляет JWT локально; сервер не отзывает выданный токен."
      security: []
      responses:
        "204":
          description: "Успешно, без тела ответа"
  "/categories":
    get:
      operationId: "listCategories"
      summary: "Получить категории заявок"
      tags:
        - "Issues"
      description: "RESIDENT и REVIEWER. ADMIN получает 403 FORBIDDEN. Источник списка - БД."
      responses:
        "200":
          description: "Успешно"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/Category"
        "401":
          "$ref": "#/components/responses/Error401"
        "500":
          "$ref": "#/components/responses/Error500"
        "403":
          "$ref": "#/components/responses/Error403"
  "/issues":
    post:
      operationId: "createIssue"
      summary: "Создать заявку"
      tags:
        - "Issues"
      description: "Только RESIDENT. Автор определяется по проверенному JWT. Issues вызывает внутренний Identity API и получает комнату и корпус. Сведения о месте проживания фиксируются в Issue. Проверяется категория. Issue со статусом NEW и начальная History с published_at=NULL сохраняются одной транзакцией в Issues DB. При недоступном Identity возвращается 503; заявка не создаётся. После фиксации транзакции событие отправляется в Kafka. Повтор POST создаёт новую заявку."
      responses:
        "201":
          description: "Создано"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Issue"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "500":
          "$ref": "#/components/responses/Error500"
        "503":
          "$ref": "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateIssueRequest"
    get:
      operationId: "listIssues"
      summary: "Получить доступные заявки"
      tags:
        - "Issues"
      description: "RESIDENT видит только свои заявки, REVIEWER - все. ADMIN не имеет доступа к заявкам: 403 FORBIDDEN. Каждая запись содержит полное описание, место и текущий статус для отображения в списке. Порядок createdAt DESC, id DESC. total считается после проверки доступа и фильтрации."
      responses:
        "200":
          description: "Успешно"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/IssuePage"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "500":
          "$ref": "#/components/responses/Error500"
        "403":
          "$ref": "#/components/responses/Error403"
      parameters:
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
            enum:
              - "NEW"
              - "IN_PROGRESS"
              - "CLOSED"
        -
          name: "categoryId"
          in: "query"
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
            maximum: 9007199254740991
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        -
          name: "offset"
          in: "query"
          schema:
            type: "integer"
            minimum: 0
            default: 0
  "/issues/{issueId}/status":
    patch:
      operationId: "changeStatus"
      summary: "Изменить статус"
      tags:
        - "Issues"
      description: "Только REVIEWER; RESIDENT и ADMIN получают 403 FORBIDDEN. NEW -> IN_PROGRESS -> CLOSED. Блокировка Issue в транзакции. Если текущий статус уже равен status: 200 без нового события и истории. Иначе несовпадение expectedStatus: 409 STATUS_CONFLICT; запрещённый переход: 409 INVALID_STATUS_TRANSITION. Issue и новая History сохраняются атомарно в Issues DB. Identity и Notifications в этой транзакции не участвуют."
      responses:
        "200":
          description: "Успешно"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Issue"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "500":
          "$ref": "#/components/responses/Error500"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ChangeStatusRequest"
      parameters:
        -
          name: "issueId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
            maximum: 9007199254740991
  "/internal/v1/users/{userId}/housing":
    get:
      operationId: "getResidentHousing"
      summary: "Получить место проживания жильца"
      tags:
        - "Internal Identity"
      servers:
        -
          url: "http://identity:8081"
          description: "Внутренняя сеть сервисов"
      security:
        -
          serviceAuth: []
      description: "Вызывается Issues только при создании заявки. userId берётся из sub проверенного JWT. Identity проверяет роль RESIDENT и наличие профиля. Возвращает текущую комнату и корпус. Отсутствующий профиль: 403 FORBIDDEN; неизвестный userId: 404 USER_NOT_FOUND. Внутренний токен проверяется независимо от пользовательского JWT. Соединение защищается сетью и HTTPS при развёртывании."
      parameters:
        -
          name: "userId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
            maximum: 9007199254740991
      responses:
        "200":
          description: "Место проживания"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ResidentHousing"
              example:
                userId: 12
                roomNumber: "203А"
                block: "11111111"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "500":
          "$ref": "#/components/responses/Error500"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
    serviceAuth:
      type: "apiKey"
      in: "header"
      name: "X-Service-Token"
      description: "Секрет межсервисного доступа Issues → Identity. Не выдаётся браузеру."
  schemas:
    Error:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
      properties:
        code:
          type: "string"
          minLength: 1
          maxLength: 100
        message:
          type: "string"
          minLength: 1
          maxLength: 500
    Role:
      type: "string"
      enum:
        - "ADMIN"
        - "RESIDENT"
        - "REVIEWER"
    IssueStatus:
      type: "string"
      enum:
        - "NEW"
        - "IN_PROGRESS"
        - "CLOSED"
    User:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "login"
        - "fullName"
        - "role"
        - "createdAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        login:
          type: "string"
          minLength: 1
          maxLength: 64
        fullName:
          type: "string"
          minLength: 1
          maxLength: 150
        role:
          "$ref": "#/components/schemas/Role"
        block:
          type: "string"
          maxLength: 50
          nullable: true
        roomNumber:
          type: "string"
          maxLength: 20
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
    Category:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "name"
      properties:
        id:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 9007199254740991
        name:
          type: "string"
          minLength: 1
          maxLength: 100
    CreateUserRequest:
      type: "object"
      additionalProperties: false
      required:
        - "login"
        - "password"
        - "fullName"
        - "role"
        - "block"
        - "roomNumber"
      properties:
        login:
          type: "string"
          minLength: 3
          maxLength: 64
        password:
          type: "string"
          format: "password"
          writeOnly: true
          minLength: 8
          maxLength: 128
        fullName:
          type: "string"
          minLength: 1
          maxLength: 150
        role:
          type: "string"
          enum:
            - "RESIDENT"
            - "REVIEWER"
        block:
          type: "string"
          minLength: 1
          maxLength: 50
        roomNumber:
          type: "string"
          minLength: 1
          maxLength: 20
    LoginRequest:
      type: "object"
      additionalProperties: false
      required:
        - "login"
        - "password"
      properties:
        login:
          type: "string"
          minLength: 3
          maxLength: 64
        password:
          type: "string"
          format: "password"
          writeOnly: true
          minLength: 6
          maxLength: 128
    LoginResponse:
      type: "object"
      additionalProperties: false
      required:
        - "accessToken"
        - "user"
      properties:
        accessToken:
          type: "string"
        user:
          "$ref": "#/components/schemas/User"
    CreateIssueRequest:
      type: "object"
      additionalProperties: false
      required:
        - "title"
        - "description"
        - "categoryId"
        - "locationDetails"
      properties:
        title:
          type: "string"
          minLength: 1
          maxLength: 150
        description:
          type: "string"
          minLength: 1
          maxLength: 5000
        categoryId:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 9007199254740991
        locationDetails:
          type: "string"
          minLength: 1
          maxLength: 250
    Issue:
      type: "object"
      required:
        - "id"
        - "residentId"
        - "categoryId"
        - "status"
        - "title"
        - "description"
        - "locationDetails"
        - "createdAt"
        - "updatedAt"
        - "roomNumber"
        - "block"
      properties:
        id:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 9007199254740991
        residentId:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 9007199254740991
        categoryId:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 9007199254740991
        status:
          "$ref": "#/components/schemas/IssueStatus"
        title:
          type: "string"
          minLength: 1
          maxLength: 150
        description:
          type: "string"
          minLength: 1
          maxLength: 5000
        locationDetails:
          type: "string"
          minLength: 1
          maxLength: 250
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        roomNumber:
          type: "string"
          maxLength: 20
        block:
          type: "string"
          maxLength: 50
    IssuePage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "limit"
        - "offset"
        - "total"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Issue"
        limit:
          type: "integer"
        offset:
          type: "integer"
        total:
          type: "integer"
          minimum: 0
    ChangeStatusRequest:
      type: "object"
      additionalProperties: false
      required:
        - "status"
        - "expectedStatus"
      properties:
        status:
          type: "string"
          enum:
            - "IN_PROGRESS"
            - "CLOSED"
        expectedStatus:
          "$ref": "#/components/schemas/IssueStatus"
    Housing:
      type: "object"
      required:
        - "roomNumber"
        - "block"
      properties:
        roomNumber:
          type: "string"
          maxLength: 20
        block:
          type: "string"
          maxLength: 50
    ResidentHousing:
      allOf:
        -
          "$ref": "#/components/schemas/Housing"
        -
          type: "object"
          required:
            - "userId"
          properties:
            userId:
              type: "integer"
              format: "int64"
              minimum: 1
              maximum: 9007199254740991
  responses:
    Error400:
      description: "VALIDATION_ERROR, INVALID_USER_ROLE, INVALID_CATEGORY, INVALID_ROOM"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: "VALIDATION_ERROR"
            message: "Некорректные данные запроса"
    Error401:
      description: "UNAUTHORIZED, INVALID_CREDENTIALS"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: "UNAUTHORIZED"
            message: "Необходим вход в систему"
    Error403:
      description: "FORBIDDEN"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: "FORBIDDEN"
            message: "Недостаточно прав"
    Error404:
      description: "USER_NOT_FOUND, ISSUE_NOT_FOUND"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: "USER_NOT_FOUND"
            message: "Объект не найден"
    Error409:
      description: "LOGIN_ALREADY_EXISTS, STATUS_CONFLICT, INVALID_STATUS_TRANSITION"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: "LOGIN_ALREADY_EXISTS"
            message: "Операция конфликтует с текущим состоянием"
    Error500:
      description: "INTERNAL_ERROR"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: "INTERNAL_ERROR"
            message: "Внутренняя ошибка сервера"
    Error503:
      description: "IDENTITY_UNAVAILABLE"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            code: "IDENTITY_UNAVAILABLE"
            message: "Не удалось получить место проживания. Повторите позже."
